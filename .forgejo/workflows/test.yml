name: CI
# Forgejo (Codeberg) variant of the test workflow. The
# .github/workflows/test.yml uses GitHub-only labels (ubuntu-latest,
# macos-latest, windows-latest) and is invisible to Codeberg.
# This file runs the same gates Codeberg can support: fmt, clippy,
# test (default features), test (--all-features), doc, on a single
# linux runner. macOS / Windows coverage lives in the GitHub workflow.
# See docs/src/internal/wave-10-f-ci-matrix.md for the matrix rationale.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly shuttle DST gate only (see the `shuttle` job below) — every
    # other job above runs per-push/PR and ignores this trigger via `if:`.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (fmt + clippy)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: lxc-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          apt-get update -q
          apt-get install -qy curl build-essential pkg-config libssl-dev

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal \
                --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets \
            --all-features -- -D warnings

  test:
    # Default-features test on Codeberg's only-Linux runners. Mirrors the
    # GitHub `test` job for ubuntu-latest. macOS / Windows coverage lives
    # in the GitHub workflow only — Forgejo doesn't offer those runners.
    name: Test default features (linux)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: lxc-bookworm
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          apt-get update -q
          apt-get install -qy curl build-essential pkg-config libssl-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          # Distinct cache key from `test-all-features` to avoid the two
          # jobs invalidating each other's `target/` (different feature
          # graphs).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-default-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-default-

      - name: Run workspace tests (default features)
        run: cargo test --workspace --no-fail-fast

  test-all-features:
    # Mirror of the GitHub `test-all-features` job. Exercises
    # `tls-native` (system OpenSSL), `tls-rustls`, `quic`,
    # `observability`, and the rep `test-harness` feature. See
    # docs/src/internal/wave-10-f-ci-matrix.md for the matrix design.
    name: Test all features (linux)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: lxc-bookworm
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          apt-get update -q
          apt-get install -qy curl build-essential pkg-config libssl-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-allfeat-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-allfeat-

      - name: Run workspace tests (--all-features)
        run: cargo test --workspace --all-features --no-fail-fast

  doc:
    name: Documentation
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: lxc-bookworm
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          apt-get update -q
          apt-get install -qy curl build-essential pkg-config libssl-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Build Rust API documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  semver-checks:
    # Advisory SemVer gate — mirrors the GitHub workflow job.  See
    # docs/src/contributing/semver-policy.md for promotion criteria.
    name: SemVer checks (advisory)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: lxc-bookworm
    needs: check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build prerequisites
        run: |
          apt-get update -q
          apt-get install -qy curl build-essential pkg-config libssl-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-semver-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-semver-

      - name: Install cargo-semver-checks (pinned)
        run: cargo install cargo-semver-checks --version 0.47.0 --locked

      - name: Run cargo-semver-checks
        run: cargo semver-checks --workspace --baseline-rev main

  shuttle:
    # DST Milestone 2 concurrency-permutation gate (shuttle). Deliberately
    # NOT run on push/PR — a full sweep over all 10 shuttle_*.rs targets
    # takes considerably longer than the rest of CI combined (thousands of
    # interleavings per test). Runs nightly + on manual dispatch only. See
    # docs/src/contributing/testing-guide.md "DST Milestone 2 — shuttle
    # concurrency gate" for what each target covers and why --release
    # matters (release is ~20-30x faster per iteration than debug).
    name: Shuttle DST gate (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: lxc-bookworm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          apt-get update -q
          apt-get install -qy curl build-essential pkg-config libssl-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          # Distinct cache key: shuttle builds under a different RUSTFLAGS
          # cfg, which changes the fingerprint of every crate in the
          # dependency graph — sharing a key with the other jobs would just
          # thrash the cache.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-shuttle-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-shuttle-

      # `make shuttle` runs all 10 shuttle_*.rs targets with
      # `RUSTFLAGS="--cfg noxu_shuttle"` and `--release`; any assertion
      # failure or shuttle-detected violation is a nonzero exit, which
      # fails this step (and the job) — no error-swallowing.
      - name: Run the shuttle DST concurrency gate
        run: make shuttle
