name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly shuttle DST gate only (see the `shuttle` job below) — every
    # other job above runs per-push/PR and ignores this trigger via `if:`.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (fmt + clippy)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install build prerequisites (libssl-dev for tls-native)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked || true

      - name: Run cargo deny (supply-chain + license gate)
        run: cargo deny check

  test:
    # Default-features test on every supported OS.
    # macOS / Windows do NOT exercise rep TLS, observability, or the
    # in-memory test harness — those are covered by `test-all-features`
    # on ubuntu-latest. See docs/src/internal/wave-10-f-ci-matrix.md.
    name: Test default features (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          # Keep cache key distinct from the all-features job so the two
          # don't fight over `target/` (different feature graphs would
          # invalidate each other constantly).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-default-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-default-

      - name: Run tests (default features, no-fail-fast)
        run: cargo test --workspace --no-fail-fast

  test-all-features:
    # All-features build *runs* on ubuntu-latest only.
    # `--all-features` enables `tls-native` (system OpenSSL), `tls-rustls`,
    # `quic`, `observability`, and the rep `test-harness`. We deliberately
    # skip macOS / Windows here to keep the toolchain story simple
    # (no vcpkg / brew openssl gymnastics in CI). See
    # docs/src/internal/wave-10-f-ci-matrix.md for the rationale.
    name: Test all features (ubuntu-latest)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install build prerequisites (libssl-dev for tls-native)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-allfeat-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-allfeat-

      - name: Run tests (--all-features, no-fail-fast)
        run: cargo test --workspace --all-features --no-fail-fast

  cross:
    name: Cross-compile (${{ matrix.target }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # AArch64 Linux — AWS Graviton, Raspberry Pi 4, Apple Silicon VMs
          - target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          # ARMv7 Linux — Raspberry Pi 2/3, embedded SBCs
          - target: armv7-unknown-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            apt: gcc-arm-linux-gnueabihf
          # RISC-V 64-bit Linux
          - target: riscv64gc-unknown-linux-gnu
            linker: riscv64-linux-gnu-gcc
            apt: gcc-riscv64-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable + cross target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cross-${{ matrix.target }}-

      # `cargo check` only — running tests on foreign architectures would
      # require qemu-user setup, which is brittle and slow. Cross-compile
      # validation catches build-time portability bugs, which is the
      # 90% case for what we want to catch on these targets.
      - name: Cross-compile (check only — no runner for foreign arch)
        run: cargo check --workspace --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc

  doc:
    name: Documentation
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Build Rust API documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Cache mdBook binaries
        id: cache-mdbook
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: mdbook-0.4.40-mermaid-0.13.0

      - name: Install mdBook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: |
          cargo install mdbook --version 0.4.40 --locked
          cargo install mdbook-mermaid --version 0.13.0 --locked

      - name: Build mdBook documentation
        run: mdbook build docs/

  semver-checks:
    # Advisory SemVer gate — checks that no public-API breaks are introduced
    # relative to the `main` branch baseline.  Currently advisory (continue-on-error
    # = true); will be promoted to blocking after the first full minor-release
    # cycle post-v3.0.0.  See docs/src/contributing/semver-policy.md.
    name: SemVer checks (advisory)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fetch full history so cargo-semver-checks can resolve --baseline-rev main
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install build prerequisites (libssl-dev for tls-native)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-semver-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-semver-

      - name: Install cargo-semver-checks (pinned)
        run: cargo install cargo-semver-checks --version 0.47.0 --locked

      - name: Run cargo-semver-checks
        run: cargo semver-checks --workspace --baseline-rev main

  shuttle:
    # DST Milestone 2 concurrency-permutation gate (shuttle). Deliberately
    # NOT run on push/PR — a full sweep over all 10 shuttle_*.rs targets
    # takes considerably longer than the rest of CI combined (thousands of
    # interleavings per test). Runs nightly + on manual dispatch only. This
    # mirrors the `shuttle` job in .forgejo/workflows/test.yml; see
    # docs/src/contributing/testing-guide.md "DST Milestone 2 — shuttle
    # concurrency gate" for what each target covers and why --release
    # matters (release is ~20-30x faster per iteration than debug).
    name: Shuttle DST gate (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          # Distinct cache key: shuttle builds under a different RUSTFLAGS
          # cfg, which changes the fingerprint of every crate in the
          # dependency graph — sharing a key with the other jobs would just
          # thrash the cache.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-shuttle-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-shuttle-

      # `make shuttle` runs all 10 shuttle_*.rs targets with
      # `RUSTFLAGS="--cfg noxu_shuttle"` and `--release`; any assertion
      # failure or shuttle-detected violation is a nonzero exit, which
      # fails this step (and the job) — no error-swallowing.
      - name: Run the shuttle DST concurrency gate
        run: make shuttle
