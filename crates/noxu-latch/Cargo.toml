[package]
name = "noxu-latch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Latching primitives for Noxu DB (shared/exclusive latches)"

[dependencies]
noxu-util = { workspace = true }
noxu-sync = { workspace = true }
log = { workspace = true }

# DST wave: only in the graph under `--cfg noxu_shuttle`. Lets a standalone
# shuttle model of the FairQueue-backed `env_fair_latches` wiring
# (crates/noxu-latch/tests/shuttle_fair_latch.rs) be explored by shuttle's
# scheduler. Default builds never pull shuttle in. Mirrors
# crates/noxu-sync/Cargo.toml's identical seam for shuttle_rwlock_reservation.rs.
[target.'cfg(noxu_shuttle)'.dependencies]
shuttle = { workspace = true }

[dev-dependencies]
hegeltest = { workspace = true }

[target.'cfg(noxu_shuttle)'.dev-dependencies]
shuttle = { workspace = true }

[lints]
workspace = true
